name: Zed extension CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zed-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_BUILD_DIR: target/build
      CARGO_NET_RETRY: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify locked native and WASI builds, tests and deterministic package
        run: bash scripts/ci.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zed-package-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/catalog/*
          if-no-files-found: error
