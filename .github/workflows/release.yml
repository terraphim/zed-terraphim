name: Gated Zed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable extension tag
        required: true
        type: string
      publish:
        description: Publish after all public download gates pass
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: zed-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SOURCE_REPO: ${{ github.repository }}
      CARGO_BUILD_BUILD_DIR: target/build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/ci.sh
      - name: Verify public source and every raw pinned LSP download
        run: python3 scripts/marketplace.py --tag "$RELEASE_TAG" --repo "$SOURCE_REPO" --out public-preflight
      - name: Package the tested WASI module for this tag
        run: python3 scripts/package.py --tag "$RELEASE_TAG" --wasm target/wasm32-wasip2/release/zed_terraphim.wasm --out-dir release-dist
      - name: Bind package bytes to the tested module and tagged source
        run: python3 scripts/package_qualification.py --tag "$RELEASE_TAG" --wasm target/wasm32-wasip2/release/zed_terraphim.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zed-release-${{ inputs.tag || github.ref_name }}
          path: |
            release-dist/*.tar.gz
            release-dist/SHA256SUMS
            release-dist/package-qualification.json
            public-preflight/preflight.json
          if-no-files-found: error
  publish:
    needs: verify
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    environment: zed-release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SOURCE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zed-release-${{ inputs.tag || github.ref_name }}
          path: verified-release
      - name: Publish verified assets without replacing existing bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_github.py --tag "$RELEASE_TAG" --repo "$SOURCE_REPO" --artifacts verified-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zed-publication-${{ inputs.tag || github.ref_name }}
          path: verified-release/publication.json
          if-no-files-found: error
