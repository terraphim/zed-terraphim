name: Gated Zed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable extension tag
        required: true
        type: string
      publish:
        description: Publish the catalog package after native source qualification
        default: false
        type: boolean
      qualified_commit:
        description: Exact native-tested source SHA (required to publish)
        default: ''
        type: string
      qualification_url:
        description: Immutable public native-qualification receipt URL (required to publish)
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: zed-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.package-upload.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SOURCE_REPO: ${{ github.repository }}
      CARGO_BUILD_BUILD_DIR: target/build
      RELEASE_EVENT: ${{ github.event_name }}
      RELEASE_REF: ${{ github.ref }}
      PUBLISH_REQUESTED: ${{ inputs.publish && 'true' || 'false' }}
      QUALIFIED_COMMIT: ${{ inputs.qualified_commit }}
      QUALIFICATION_URL: ${{ inputs.qualification_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/ci.sh
      - name: Verify public source and every raw pinned LSP download
        run: >-
          python3 scripts/marketplace.py --tag "$RELEASE_TAG" --repo "$SOURCE_REPO"
          --extension-path catalog/terraphim-lsp --out public-preflight
          --release-event "$RELEASE_EVENT" --release-ref "$RELEASE_REF"
          --release-publish "$PUBLISH_REQUESTED" --qualified-commit "$QUALIFIED_COMMIT"
          --qualification-url "$QUALIFICATION_URL"
      - name: Package the tested WASI module for this tag
        run: python3 scripts/catalog_package.py --tag "$RELEASE_TAG" --wasm catalog/terraphim-lsp/target/wasm32-wasip2/release/zed_terraphim_lsp.wasm --out release-dist
      - name: Bind package bytes to the tested module and tagged source
        run: python3 scripts/package_qualification.py --tag "$RELEASE_TAG" --extension-path catalog/terraphim-lsp --wasm catalog/terraphim-lsp/target/wasm32-wasip2/release/zed_terraphim_lsp.wasm
      - id: package-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zed-release-${{ inputs.tag || github.ref_name }}
          path: |
            release-dist/*.tar.gz
            release-dist/SHA256SUMS
            release-dist/package-qualification.json
            public-preflight/preflight.json
            public-preflight/native-qualification.json
          if-no-files-found: error
  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    environment: zed-release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SOURCE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          merge-multiple: true
          path: verified-release
      - name: Publish verified assets without replacing existing bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_github.py --tag "$RELEASE_TAG" --repo "$SOURCE_REPO" --artifacts verified-release --extension-path catalog/terraphim-lsp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zed-publication-${{ inputs.tag || github.ref_name }}
          path: verified-release/publication.json
          if-no-files-found: error
