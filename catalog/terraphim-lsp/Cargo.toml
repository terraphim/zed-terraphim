[package]
name = "zed-terraphim-lsp"
version = "0.2.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Thin Zed extension that launches terraphim-lsp for Markdown"
repository = "https://github.com/terraphim/zed-terraphim"

[lib]
path = "../../src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["public-catalog"]
mcp = []
public-catalog = []

[dependencies]
zed_extension_api = "0.7.0"
serde_json = "1"
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true
