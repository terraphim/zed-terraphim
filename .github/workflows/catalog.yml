name: Prepare verified Zed catalog submission
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable extension tag
        required: true
        type: string
      qualified_commit:
        description: Full source SHA manually tested in stock Zed
        required: true
        type: string
      qualification_url:
        description: HTTPS link to the saved native Zed acceptance evidence
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: zed-catalog
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_REPO: ${{ github.repository }}
      QUALIFIED_COMMIT: ${{ inputs.qualified_commit }}
      QUALIFICATION_URL: ${{ inputs.qualification_url }}
      CARGO_BUILD_BUILD_DIR: target/build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/ci.sh
      - name: Fail closed on source, native qualification, policy and raw LSP downloads
        run: python3 scripts/marketplace.py --catalog --extension-path catalog/terraphim-lsp --tag "$RELEASE_TAG" --repo "$SOURCE_REPO" --qualified-commit "$QUALIFIED_COMMIT" --qualification-url "$QUALIFICATION_URL" --out public-preflight
      - name: Prepare the patch for human submission under upstream AI policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_catalog.py --tag "$RELEASE_TAG" --preflight public-preflight/preflight.json --out catalog-submission
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zed-catalog-${{ inputs.tag }}
          path: |
            public-preflight/preflight.json
            catalog-submission/*
          if-no-files-found: error
